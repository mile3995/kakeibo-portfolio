spring.application.name=kakeibo
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/kakeibo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
app.security.secure-cookies=${APP_SECURE_COOKIES:false}
app.demo-mode=${APP_DEMO_MODE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_SECURE_COOKIES:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB
